services:
  db:
    image: postgres:16-alpine
    container_name: nifty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nifty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nifty}
      POSTGRES_DB: ${POSTGRES_DB:-nifty}
    ports:
      - "5432:5432"
    volumes:
      - nifty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nifty}"]
      interval: 5s
      retries: 10

volumes:
  nifty_pgdata:
