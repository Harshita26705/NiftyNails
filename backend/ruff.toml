line-length = 130
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP046"]  # FastAPI dependency defaults; Generic[T] kept for Pydantic generics

[lint.per-file-ignores]
"tests/*" = ["E501"]
"app/seed/data.py" = ["E501"]
